<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help a Pet - PawRescue</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <nav class="navbar">
        <div class="logo">🐾 PawRescue</div>

        <ul class="nav-menu">
            <li><a href="index.html#home">Home</a></li>
            <li><a href="index.html#about">About</a></li>
            <li><a href="index.html#pets">Pets</a></li>
            <li><a href="index.html#contact">Contact</a></li>
        </ul>
    </nav>
</header>

<section class="donation-page">

    <h1>HELP A PET</h1>

    <p>
        Bantu kami menyediakan makanan dan perawatan
        untuk hewan yang sedang diselamatkan.
    </p>

    <div class="donation-box">

        <h2>Donasi untuk PawRescue</h2>

        <label>Nama Donatur</label>
        <input type="text" id="donorName" placeholder="Masukkan nama">

        <label>Pilih Nominal</label>

        <div class="amount-list">
            <button type="button" class="amount" data-value="10000">Rp10.000</button>
            <button type="button" class="amount" data-value="25000">Rp25.000</button>
            <button type="button" class="amount" data-value="50000">Rp50.000</button>
            <button type="button" class="amount" data-value="100000">Rp100.000</button>
        </div>

        <label>Nominal Lainnya</label>
        <input type="number" id="customAmount" placeholder="Masukkan nominal">

        <label>Metode Pembayaran</label>

        <select id="paymentMethod">
            <option value="">Pilih metode pembayaran</option>
            <option value="Transfer Bank">Transfer Bank</option>
            <option value="E-Wallet">E-Wallet</option>
        </select>

        <button type="button" id="donationButton" class="btn">
            Donasi Sekarang
        </button>

        <p id="donationMessage"></p>

    </div>

    <a href="index.html" class="btn">Kembali ke Home</a>

</section>

<footer>
    <p>© 2026 PawRescue</p>
</footer>

<script src="donation.js"></script>

</body>

</html>
